name: Build and Push ingestion-sink

on:
  push:
    branches:
      - main
    paths:
      - "checkstyle/**"
      - "ingestion-sink/**"
      - "ingestion-core/**"
      - "pom.xml"
      - ".github/workflows/build-and-push-sink.yaml"

jobs:
  ingestion-sink:
    permissions:
      contents: read
      id-token: write
    uses: mozilla/deploy-actions/.github/workflows/build-and-push.yml@1f02139c84391c65aff23bd7c74ff39bec5c29a7  # v6.8.0
    with:
      # The artifact-writer service account only trusts jobs in the `build` environment.
      environment: build
      image_name: ingestion-sink
      gar_name: ingestion-sink-prod
      project_id: moz-fx-ingestion-sink-prod
      image_build_context: ./
      dockerfile_path: ./ingestion-sink/Dockerfile
      should_tag_latest: true
