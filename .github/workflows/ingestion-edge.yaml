name: ingestion-edge

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    working-directory: ingestion-edge

jobs:
  changed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      edge: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files: |
            ingestion-edge/**
            .github/workflows/ingestion-edge.yaml

  ingestion-edge-test:
    needs: changed
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || needs.changed.outputs.edge == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
      - name: Build
        run: bin/build
      - name: PyTest with linters
        run: bin/pytest-all
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ingestion-edge-test-results
          path: ingestion-edge/test-results

  ingestion-edge-verify-requirements:
    needs: changed
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || needs.changed.outputs.edge == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Verify that requirements.txt contains the right dependencies for this python version
        run: |
          pip install pip-tools --constraint requirements.in
          pip-compile --allow-unsafe --generate-hashes --quiet
          git diff --exit-code -G '^ *[^# ]' -- requirements.txt

  # Single required status check for ingestion-edge. Skipped jobs count as passing
  # here; failed or cancelled don't.
  ingestion-edge:
    needs: [changed, ingestion-edge-test, ingestion-edge-verify-requirements]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    defaults:
      run:
        # Nothing is checked out here, so the ingestion-edge directory doesn't exist.
        working-directory: .
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ] && [ "$result" != skipped ]; then
              exit 1
            fi
          done
