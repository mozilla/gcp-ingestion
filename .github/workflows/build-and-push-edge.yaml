name: Build and Push ingestion-edge

on:
  push:
    branches:
      - main
    paths:
      - "ingestion-edge/**"
      - ".github/workflows/build-and-push-edge.yaml"

jobs:
  ingestion-edge:
    permissions:
      contents: read
      id-token: write
    uses: mozilla/deploy-actions/.github/workflows/build-and-push.yml@1f02139c84391c65aff23bd7c74ff39bec5c29a7  # v6.8.0
    with:
      # The artifact-writer service account only trusts jobs in the `build` environment.
      environment: build
      image_name: ingestion-edge
      gar_name: ingestion-edge-prod
      project_id: moz-fx-ingestion-edge-prod
      image_build_context: ./ingestion-edge
      dockerfile_path: ./ingestion-edge/Dockerfile
      should_tag_latest: true
