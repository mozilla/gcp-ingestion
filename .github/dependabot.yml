version: 2
updates:
- package-ecosystem: maven
  directory: /
  ignore:
  - dependency-name: com.google.cloud:libraries-bom
  - dependency-name: com.fasterxml.jackson:jackson-bom
  - dependency-name: org.apache.avro:avro
  - dependency-name: org.springframework:spring-core
    # Spring 6 requires Java 17
    versions: [">=6.0.0"]
  - dependency-name: com.puppycrawl.tools:checkstyle
    # Checkstyle 11+ requires Java 17
    versions: [">=11.0.0"]
  - dependency-name: com.diffplug.spotless:spotless-maven-plugin
    # Spotless 3.x requires Java 17
    versions: [">=3.0.0"]
  - dependency-name: org.apache.logging.log4j:log4j-bom
    # Log4j 2.2+ requires Junit5, otherwise ingestion-sink build fails
    versions: [">=2.2.0"]
  - dependency-name: org.apache.logging.log4j:log4j-core
    # Log4j 2.2+ requires Junit5, otherwise ingestion-sink build fails
    versions: [ ">=2.2.0" ]
  - dependency-name: com.squareup.okhttp3:*
    # OkHttp 5.x uses Kotlin Multiplatform and requires artifact changes (okhttp -> okhttp-jvm)
    versions: [">=5.0.0"]
  - dependency-name: com.maxmind.geoip2:geoip2
    # GeoIP2 5.x requires Java 17
    versions: [">=5.0.0"]
  - dependency-name: org.codehaus.mojo:build-helper-maven-plugin
    # 3.7.0+ requires Maven 3.9, but the Docker builds use maven:3-jdk-11 (Maven 3.8)
    versions: [">=3.7.0"]
  schedule:
    interval: weekly
  groups:
    java-minor-patch:
      update-types: [minor, patch]
      patterns: ["*"]
      exclude-patterns:
      # Review Beam upgrades separately for breaking changes
      - "org.apache.beam:*"
  labels:
  - dependencies
  - java
- package-ecosystem: maven
  directory: /ingestion-sink
  allow:
  - dependency-name: com.google.cloud:libraries-bom
  schedule:
    interval: daily
  labels:
  - dependencies
  - java
- package-ecosystem: pip
  directory: /ingestion-edge
  schedule:
    interval: daily
  labels:
  - dependencies
  - python
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  cooldown:
    default-days: 7
  groups:
    github-actions:
      patterns: ["*"]
      exclude-patterns:
      # Bumping this changes build-and-push-*.yaml, which rebuilds the prod images
      - "mozilla/deploy-actions*"
  labels:
  - dependencies
