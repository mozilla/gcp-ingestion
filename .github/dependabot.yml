version: 2
updates:
- package-ecosystem: maven
  directory: /
  ignore:
  - dependency-name: com.google.cloud:libraries-bom
  - dependency-name: com.fasterxml.jackson:jackson-bom
  - dependency-name: org.apache.avro:avro
  - dependency-name: org.springframework:spring-core
    # Spring 6 requires Java 17
    versions: [">=6.0.0"]
  - dependency-name: com.puppycrawl.tools:checkstyle
    # Checkstyle 11+ requires Java 17
    versions: [">=11.0.0"]
  - dependency-name: com.diffplug.spotless:spotless-maven-plugin
    # Spotless 3.x requires Java 17
    versions: [">=3.0.0"]
  - dependency-name: org.apache.logging.log4j:log4j-bom
    # Log4j 2.2+ requires Junit5, otherwise ingestion-sink build fails
    versions: [">=2.2.0"]
  - dependency-name: org.apache.logging.log4j:log4j-core
    # Log4j 2.2+ requires Junit5, otherwise ingestion-sink build fails
    versions: [ ">=2.2.0" ]
  - dependency-name: com.squareup.okhttp3:*
    # OkHttp 5.x uses Kotlin Multiplatform and requires artifact changes (okhttp -> okhttp-jvm)
    versions: [">=5.0.0"]
  - dependency-name: com.maxmind.geoip2:geoip2
    # GeoIP2 5.x requires Java 17
    versions: [">=5.0.0"]
  schedule:
    interval: weekly
  groups:
    java-minor-patch:
      update-types: [minor, patch]
      patterns: ["*"]
      exclude-patterns:
      # Bump these separately so they stay in line with the versions in Beam's BOM
      - "org.apache.beam:*"
      - "com.google.http-client:*"
  labels:
  - dependencies
  - java
- package-ecosystem: maven
  directory: /ingestion-sink
  allow:
  - dependency-name: com.google.cloud:libraries-bom
  schedule:
    interval: daily
  labels:
  - dependencies
  - java
- package-ecosystem: pip
  directory: /ingestion-edge
  schedule:
    interval: daily
  labels:
  - dependencies
  - python
